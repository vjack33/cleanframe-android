[package]
name = "cleanframe-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = { version = "1.9", features = ["backend-android-activity-06"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
android_logger = "0.14"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.9"

